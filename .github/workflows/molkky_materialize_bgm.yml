name: Materialize Molkky BGM WAV
on:
  push:
    paths:
      - '.github/workflows/molkky_materialize_bgm.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ievan_v29.wav
        shell: python
        run: |
          import math, random, struct, wave
          from pathlib import Path

          SR=22050
          BPM=172
          EIGHTH=(60/BPM)/2
          SEMI={'C':0,'C#':1,'Db':1,'D':2,'D#':3,'Eb':3,'E':4,'F':5,'F#':6,'Gb':6,'G':7,'G#':8,'Ab':8,'A':9,'A#':10,'Bb':10,'B':11}
          def hz(note):
              letter=note[0]; accidental=''
              pos=1
              if note[1] in '#b': accidental=note[1]; pos=2
              octave=int(note[pos:])
              midi=12*(octave+1)+SEMI[letter+accidental]
              return 440*(2**((midi-69)/12))

          A=[('A4',1.5),('D5',.5),('D5',1),('E5',1),('F5',1),('D5',1),('D5',1),('F5',1),('E5',1),('C5',1),('C5',1),('E5',1),('F5',.5),('E5',.5),('D5',.5),('C5',.5),('D5',1),('A4',1),('D5',1.5),('D5',.5),('D5',1),('E5',1),('F5',1),('D5',1),('D5',2),('G5',.5),('A5',.5),('G5',.5),('F5',.5),('E5',1),('D5',1),('F5',1),('D5',1),('D5',2)]
          B=[('A5',1),('A5',1),('G5',1),('F5',1),('E5',1),('C5',1),('C5',1),('E5',1),('G5',1),('G5',1),('F5',1),('E5',1),('F5',1),('D5',1),('D5',1),('F5',1),('A5',1),('A5',1),('G5',1),('F5',1),('E5',1),('C5',1),('C5',1),('E5',1),('G5',1),('G5',1),('F5',1),('E5',1),('F5',1),('D5',1),('D5',2)]
          D=[('A5',1.5),('F5',.5),('F5',1),('A5',1),('G5',1),('E5',1),('E5',1),('F5',1),('G5',.5),('A5',.5),('G5',.5),('F5',.5),('E5',1),('D5',1),('D5',1),('E5',1),('F5',1),('G5',1),('A5',1.5),('F5',.5),('F5',1),('A5',1),('G5',1),('E5',1),('E5',1),('F5',1),('G5',.5),('A5',.5),('G5',.5),('F5',.5),('E5',1),('D5',1),('F5',1),('D5',1),('D5',2)]
          melody=A+A+B+B+A+A+D+D
          progression=['D2','D2','C2','D2','D2','D2','A2','D2','D2','C2','C2','D2','D2','C2','A2','D2']
          total=sum(u for _,u in melody)
          duration=total*EIGHTH
          n=int(duration*SR)
          mix=[0.0]*n
          def add(i,x):
              if 0<=i<n: mix[i]+=x
          def osc(freq,t,dur,amp,kind='sine'):
              count=max(1,int(dur*SR))
              for k in range(count):
                  tt=k/SR
                  ph=2*math.pi*freq*tt
                  if kind=='square': y=1 if math.sin(ph)>=0 else -1
                  elif kind=='triangle': y=(2/math.pi)*math.asin(math.sin(ph))
                  elif kind=='saw': y=2*((freq*tt)%1)-1
                  else: y=math.sin(ph)
                  env=(1-math.exp(-tt/0.006))*math.exp(-tt/max(.03,dur*.55))
                  add(int((t+tt)*SR), y*amp*env)
          def noise(t,dur,amp):
              r=random.Random(int(t*100000)+29)
              count=max(1,int(dur*SR))
              for k in range(count):
                  tt=k/SR
                  add(int((t+tt)*SR),(r.random()*2-1)*amp*math.exp(-tt/max(.005,dur*.22)))
          def kick(t,s):
              count=int(.23*SR); phase=0.0
              for k in range(count):
                  tt=k/SR
                  f=145*((43/145)**(min(tt,.075)/.075))
                  phase+=2*math.pi*f/SR
                  add(int((t+tt)*SR),math.sin(phase)*.58*s*math.exp(-tt/.055))
          def bass(note,t,s):
              osc(hz(note),t,.26,.42*s,'sine'); osc(hz(note)*2,t,.20,.17*s,'triangle'); osc(hz(note)*2,t,.12,.04*s,'square'); osc(hz(note)*.5,t,.15,.10*s,'sine')
          def brass(note,t,units,accent):
              dur=max(.08,units*EIGHTH*.90); f=hz(note)
              osc(f,t,dur,.060*accent*.60,'saw'); osc(f*1.004,t,dur,.060*accent*.45,'saw'); osc(f*.5,t,dur,.060*accent*.22,'square'); osc(f*2,t,dur,.060*accent*.20,'triangle')

          for u in range(math.ceil(total)):
              t=u*EIGHTH; pos=u%4; bar=u//4; root=progression[bar%len(progression)]
              if pos==0: kick(t,1.38); bass(root,t,1.42)
              if pos==2: kick(t,1.24); bass(root,t,1.30)
              if pos==1: noise(t,.055,.12*1.28); noise(t,.095,.060*.48)
              if pos==3: noise(t,.055,.12*1.42); noise(t,.095,.060*.58)
              noise(t,.035,.020*(.72 if pos in (0,2) else .90))
          start=0
          for i,(note,units) in enumerate(melody):
              brass(note,start*EIGHTH,units,1.08 if i%16==0 else 1.0)
              start+=units

          peak=max(abs(v) for v in mix) or 1
          scale=.92/peak
          out=Path('molkky/audio/bgm/ievan_v29/ievan_v29.wav')
          out.parent.mkdir(parents=True,exist_ok=True)
          with wave.open(str(out),'wb') as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(SR)
              frames=bytearray()
              for v in mix:
                  x=max(-1,min(1,v*scale))
                  frames += struct.pack('<h',int(x*32767))
              w.writeframes(frames)
          b=out.read_bytes()
          assert len(b)>100000 and b[:4]==b'RIFF' and b[8:12]==b'WAVE'
          print(out, len(b), duration)
      - name: Commit physical BGM file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add molkky/audio/bgm/ievan_v29/ievan_v29.wav
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Materialize ievan v29 BGM WAV'
          git push
