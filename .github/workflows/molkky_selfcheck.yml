name: Molkky Selfcheck

on:
  push:
    paths:
      - 'molkky/**'
      - '.github/workflows/molkky_selfcheck.yml'
  pull_request:
    paths:
      - 'molkky/**'
      - '.github/workflows/molkky_selfcheck.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find molkky -name '*.js' -print0 | while IFS= read -r -d '' f; do
            node --check "$f"
          done

      - name: Active release and locked assets
        shell: python
        run: |
          import hashlib
          import json
          import re
          from pathlib import Path

          root = Path('molkky')
          manifest = json.loads((root / 'ACTIVE_RELEASE.json').read_text())
          index = (root / 'index.html').read_text()
          game = (root / 'game.js').read_text()

          def git_blob_sha(path):
              data = path.read_bytes()
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          legacy = manifest['legacy_reference']
          baseline = manifest['prototype_baseline']
          assert manifest['schema_version'] == 2
          assert manifest['status'] == 'active_development'
          assert legacy['version'] == 'v35'
          assert legacy['status'] == 'frozen_history_only'
          assert legacy['runtime_query'] in index
          assert legacy['selftest_query'] in index
          for rel, expected in legacy['protected_git_blobs'].items():
              assert git_blob_sha(root / rel) == expected, f'fixed v35 file changed: {rel}'

          experiment = manifest['active_experiment']
          experiment_entry = root / experiment['entrypoint'].split('?')[0]
          assert experiment_entry.is_file(), f'missing experiment entrypoint: {experiment_entry}'
          fx = experiment_entry.read_text()
          assert baseline['version'] == 'local-match-v59'
          assert baseline['commit'] == 'b4accab286f49f753b05a77ab63423be42da289b'
          assert experiment['base_version'] == baseline['version']
          for module in experiment['modules']:
              module_path = root / module['path']
              assert module_path.is_file(), f'missing experiment module: {module_path}'
              assert module['html_src'] in fx, f'module not loaded: {module["path"]}'

          effect_sources = '\n'.join(path.read_text() for path in (root / 'effects').rglob('*.js'))
          for forbidden_api in ['AudioContext', 'webkitAudioContext', 'createOscillator', 'createBuffer']:
              assert forbidden_api not in effect_sources, f'audio API leaked into effects/: {forbidden_api}'
          impact_audio = root / 'audio/se/manga_overdrive/synth.js'
          assert impact_audio.is_file(), 'missing isolated manga impact audio'
          assert 'AudioContext' in impact_audio.read_text(), 'impact audio synthesis is not in audio/'

          bgm_pack = (root / 'audio/bgm/ievan_v29/pack.js').read_text()
          bgm_runtime = (root / 'experiments/local_versus/file-bgm-player.js').read_text()
          shared_audio_runtime = (root / 'core/audio-runtime.js').read_text()
          assert "src:'audio/bgm/ievan_v29/ievan_v29.wav'" in bgm_pack
          assert sha256(root / 'audio/bgm/ievan_v29/ievan_v29.wav') == 'f275b957e9b1ca88321ace882c669e1e5f3b4890aedb5ee77ab60b4ab09f69fa'
          assert "MolkkyContent.required('audio.bgm')" in bgm_runtime
          assert 'decodeAudioData' in bgm_runtime and 'source.loop=definition.loop!==false' in bgm_runtime
          assert 'createOscillator' not in bgm_runtime and 'createBuffer(' not in bgm_runtime
          assert '__BGM_V29__' not in shared_audio_runtime
          assert 'bgmRequested=false' in ''.join(shared_audio_runtime.split())

          required = [
              'core/character-manager.js', 'characters/gal01/pack.js',
              'core/stage-manager.js', 'stages/seaside90s/pack.js',
              'core/audio-manager.js', 'audio/voices/gal01/pack.js',
              'audio/se/default/pack.js', 'audio/bgm/ievan_v29/pack.js',
              'core/presentation-runtime.js', 'core/stage-runtime.js',
              'core/audio-runtime.js', 'core/selftest.js'
          ]
          for rel in required:
              assert (root / rel).is_file(), f'missing: {rel}'
              assert rel in index, f'not loaded by fixed build: {rel}'

          forbidden_files = [
              'assets.js', 'audiofix.js', 'bgm29.js', 'characters.js',
              'galcompat.js', 'galfix.js', 'selftest.js',
              'core/bgm-continuity.js', 'audio/bgm/ievan_v29/engine.js',
              'gal/normal.webp.b64', 'characters/gal01/atlas.webp',
              'stages/seaside90s/background.svg',
              'fx36.html', 'fx36.css', 'core/impact-effects.js'
          ]
          for rel in forbidden_files:
              assert not (root / rel).exists(), f'legacy file exists: {rel}'
          for dirname in ['legacy', 'old', 'backup', 'bak']:
              assert not any(p.is_dir() and p.name.lower() == dirname for p in root.rglob('*')), f'legacy directory exists: {dirname}'

          stage_pack = (root / 'stages/seaside90s/pack.js').read_text()
          background = manifest['locked_assets']['background']
          assert background['path'] in stage_pack
          assert 'background.svg' not in stage_pack
          assert sha256(root / background['path']) == background['sha256']

          molkkaari = manifest['locked_assets']['molkkaari']
          assert sha256(root / molkkaari['path']) == molkkaari['sha256']

          skittle_lock = json.loads((root / manifest['locked_assets']['skittles_lock']).read_text())
          assert skittle_lock['count'] == 12
          for name, expected in skittle_lock['files'].items():
              assert sha256(root / skittle_lock['activeDirectory'] / name) == expected, name

          character_lock = json.loads((root / manifest['locked_assets']['character_lock']).read_text())
          for item in character_lock['runtime_assets'].values():
              assert sha256(root / 'characters/gal01' / item['file']) == item['sha256'], item['file']

          compact = ''.join(game.split())
          assert 'FIELD_Y_SHIFT=80' in compact
          assert '[[[1,-36],[2,36]],[[3,-72],[10,0],[4,72]],[[5,-108],[11,-36],[12,36],[6,108]],[[7,-72],[9,0],[8,72]]]' in compact
          assert 'score>50){score=25' in compact
          assert 'f.length===1?f[0].n:f.length' in compact
          assert 'misses>=3' in compact

          content_pack_path = root / experiment['prototype_content']
          content_pack = content_pack_path.read_text()
          assert "id:'prototype-v59'" in content_pack
          assert "background:{src:'stages/" in content_pack
          assert "fit:'stretch'" in content_pack
          assert "text:{" in content_pack and "audio:{" in content_pack and "images:{" in content_pack
          asset_refs = re.findall(r"['\"]([^'\"]+\.(?:webp|wav)(?:\?v=\d+)?)['\"]", content_pack)
          assert len(set(asset_refs)) >= 20
          for reference in asset_refs:
              assert (root / reference.split('?')[0]).is_file(), f'content asset missing: {reference}'

          prototype_game = (root / 'experiments/local_versus/game-runtime.js').read_text()
          prototype_compact = ''.join(prototype_game.split())
          for gameplay_lock in ['FIELD_Y_SHIFT=80', '[[[1,-36],[2,36]],[[3,-72],[10,0],[4,72]],[[5,-108],[11,-36],[12,36],[6,108]],[[7,-72],[9,0],[8,72]]]', 'score>50){score=25', 'f.length===1?f[0].n:f.length', 'misses>=3']:
              assert gameplay_lock in prototype_compact, f'prototype gameplay drift: {gameplay_lock}'
          system_sources = [
              prototype_game,
              (root / 'experiments/local_versus/match-runtime.js').read_text(),
              (root / 'experiments/local_versus/content-runtime.js').read_text(),
              bgm_runtime,
              (root / 'experiments/manga_overdrive/prototype-runtime.js').read_text(),
              (root / 'effects/manga_overdrive/engine.js').read_text(),
              (root / 'experiments/local_versus/game-selftest.js').read_text(),
          ]
          for source in system_sources:
              for physical_root in ['stages/', 'characters/', 'objects/', 'audio/']:
                  assert physical_root not in source, f'physical content path leaked into runtime: {physical_root}'
          for source in system_sources:
              assert not re.search(r'[\u3040-\u30ff\u3400-\u9fff]', source), 'replaceable Japanese copy leaked into gameplay runtime'

          versus = (root / 'experiments/local_versus/match-runtime.js').read_text()
          versus_compact = ''.join(versus.split())
          assert 'players=[makePlayer' in versus_compact
          assert 'active=active?0:1' in versus_compact
          assert 'pinBoard:pins.map' in versus_compact
          assert "players[active].score=score" in versus_compact
          assert "players[active].misses=misses" in versus_compact
          assert "window.resetGame=resetGame" in versus_compact
          assert "setup.dataset.spaceGuard='true'" in versus_compact
          assert "settleSharedBoard();recordActive()" in versus_compact
          assert "pin.state='standing';pin.rot=0;pin.lean=0" in versus_compact
          assert "opponentMode=mode==='human'?'human':'cpu'" in versus_compact
          assert 'scheduleCpu()' in versus_compact

          cpu = ''.join((root / 'experiments/local_versus/cpu-easy.js').read_text().split())
          assert "id:'cpu-easy-v1'" in cpu
          assert "difficulty:'easy'" in cpu

          versus_css = ''.join((root / 'experiments/local_versus/match.css').read_text().split())
          assert '#game{overflow:clip}' in versus_css
          assert '#game.match-setup-open#versusHud' in versus_css

          versus_selftest = ''.join((root / 'experiments/local_versus/match-selftest.js').read_text().split())
          for required_check in ['v59contentpack', 'contentfileBGMruntime', 'contentbinding', 'imagepackbinding', 'contentcatalog', 'initialmatchstate', 'uprightsharedboard', 'defaultCPUopponent', 'weakCPUplan', 'contentWAVsource', 'opponentselector', 'setupscroll', 'setupbounds', 'pre-startHUD', 'nameinputguard', 'restartbinding']:
              assert required_check in versus_selftest

          print('MOLKKY ACTIVE RELEASE SELFTEST PASS')
