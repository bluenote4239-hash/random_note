name: Molkky Selfcheck
on:
  push:
    paths:
      - 'molkky/**'
      - '.github/workflows/molkky_selfcheck.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find molkky -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Physical assets architecture and fixed rules
        shell: python
        run: |
          from pathlib import Path
          root=Path('molkky')
          idx=(root/'index.html').read_text()
          refs=['core/character-manager.js','characters/gal01/pack.js','core/stage-manager.js','stages/seaside90s/pack.js','core/audio-manager.js','audio/voices/gal01/pack.js','audio/se/default/pack.js','core/legacy-game-bridge.js','audio/bgm/ievan_v29/engine.js','audio/bgm/ievan_v29/pack.js','core/selftest.js']
          for r in refs:
              assert (root/r).exists(), r
              assert r in idx, 'not loaded: '+r
          assert idx.index('core/legacy-game-bridge.js') < idx.index('game.js')
          assert idx.index('characters/gal01/pack.js') < idx.index('game.js')
          chars=['full.webp','normal.webp','joy.webp','surprise.webp','thinking.webp','regret.webp']
          for n in chars:
              p=root/'characters/gal01'/n
              b=p.read_bytes(); assert len(b)>1000 and b[:4]==b'RIFF' and b[8:12]==b'WEBP',n
          assert not (root/'characters/gal01/atlas.webp').exists(),'atlas is prohibited'
          cp=(root/'characters/gal01/pack.js').read_text()
          for n in chars: assert ('characters/gal01/'+n) in cp,n
          stage_img=root/'stages/seaside90s/background.svg'
          assert stage_img.exists() and stage_img.stat().st_size>1000
          stage=(root/'stages/seaside90s/pack.js').read_text()
          assert "background:'stages/seaside90s/background.svg'" in stage and "bgm:'ievan_v29'" in stage
          voice_names=['yeah_01.wav','yeah_03.wav','nice_01.wav','nice_02.wav','yatta_01.wav','yarii_01.wav','sugoi_01.wav','sassugaa_02.wav']
          for n in voice_names:
              p=root/'audio/voices/gal01'/n; b=p.read_bytes()
              assert len(b)>1000 and b[:4]==b'RIFF' and b[8:12]==b'WAVE',n
          voice=(root/'audio/voices/gal01/pack.js').read_text()
          assert 'amitaro.net/download/voice/' not in voice,'external direct voice URL prohibited'
          for n in voice_names: assert ('audio/voices/gal01/'+n) in voice,n
          se_names=['wood_hit_01.wav','wood_hit_02.wav','wood_hit_03.wav','throw_whoosh.wav','land_01.wav']
          for n in se_names:
              p=root/'audio/se/default'/n; b=p.read_bytes()
              assert len(b)>1000 and b[:4]==b'RIFF' and b[8:12]==b'WAVE',n
          se=(root/'audio/se/default/pack.js').read_text()
          for n in se_names: assert ('audio/se/default/'+n) in se,n
          game=(root/'game.js').read_text(); compact=''.join(game.split())
          assert '[[[1,-36],[2,36]],[[3,-72],[10,0],[4,72]],[[5,-108],[11,-36],[12,36],[6,108]],[[7,-72],[9,0],[8,72]]]' in compact
          bgm=(root/'audio/bgm/ievan_v29/engine.js').read_text()
          assert "version:'v29'" in bgm and 'master.gain.value=.46' in bgm
          print('MOLKKY PHYSICAL-ASSET SELFTEST PASS')
