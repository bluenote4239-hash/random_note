name: Molkky Selfcheck
on:
  push:
    paths:
      - 'molkky/**'
      - '.github/workflows/molkky_selfcheck.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find molkky -name '*.js' -print0 | while IFS= read -r -d '' f; do node --check "$f"; done
      - name: Architecture rules and assets
        shell: python
        run: |
          from pathlib import Path
          root=Path('molkky')
          idx=(root/'index.html').read_text()
          refs=[
            'core/character-manager.js','characters/gal01/pack.js','characters/gal01/atlas.webp',
            'core/stage-manager.js','stages/seaside90s/pack.js',
            'core/audio-manager.js','audio/voices/gal01/pack.js','audio/se/default/pack.js',
            'audio/bgm/ievan_v29/engine.js','audio/bgm/ievan_v29/pack.js','core/selftest.js'
          ]
          for r in refs:
            assert (root/r).exists(), r
          for r in [x for x in refs if not x.endswith('.webp')]:
            assert r in idx, 'not loaded: '+r
          assert 'assets.js' not in idx, 'legacy character asset still loaded'
          assert 'bgm29.js' not in idx, 'root BGM still loaded'
          assert (root/'characters/gal01/atlas.webp').stat().st_size>1000
          game=(root/'game.js').read_text()
          compact=''.join(game.split())
          assert '[[[1,-36],[2,36]],[[3,-72],[10,0],[4,72]],[[5,-108],[11,-36],[12,36],[6,108]],[[7,-72],[9,0],[8,72]]]' in compact
          stage=(root/'stages/seaside90s/pack.js').read_text()
          assert "bgm:'ievan_v29'" in stage
          voice=(root/'audio/voices/gal01/pack.js').read_text()
          assert voice.count('amitaro.net/download/voice/')==8
          bgm=(root/'audio/bgm/ievan_v29/engine.js').read_text()
          assert "version:'v29'" in bgm and 'master.gain.value=.46' in bgm
          se=(root/'audio/se/default/pack.js').read_text()
          assert all(x in se for x in ['wood:function','whoosh:function','land:function'])
          print('MOLKKY MODULAR SELFTEST PASS')
