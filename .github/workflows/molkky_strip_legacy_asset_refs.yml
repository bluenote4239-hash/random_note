name: Strip legacy Molkky asset references
on:
  push:
    paths:
      - '.github/workflows/molkky_strip_legacy_asset_refs.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy image/external voice references only
        shell: python
        run: |
          from pathlib import Path
          p=Path('molkky/game.js')
          s=p.read_text()
          old=s
          s=s.replace("$('galFull').src=GAL_IMGS.full;ui.icon.src=GAL_IMGS.normal;ui.cutinImg.src=GAL_IMGS.joy;\n","")
          s=s.replace("function setGal(e,t){ui.icon.src=GAL_IMGS[e]||GAL_IMGS.normal;if(t)ui.bubble.textContent=t}","function setGal(e,t){if(t)ui.bubble.textContent=t}")
          s=s.replace("function cutin(k,l,e='joy',ms=850){ui.cutin.className=k+' show';ui.cutinText.textContent=l;ui.cutinImg.src=GAL_IMGS[e]||GAL_IMGS.joy;setTimeout(()=>ui.cutin.className='',ms)}","function cutin(k,l,e='joy',ms=850){ui.cutin.className=k+' show';ui.cutinText.textContent=l;setTimeout(()=>ui.cutin.className='',ms)}")
          repl={
          'https://amitaro.net/download/voice/401_ainote/yeah_01.wav':'audio/voices/gal01/yeah_01.wav',
          'https://amitaro.net/download/voice/401_ainote/yeah_03.wav':'audio/voices/gal01/yeah_03.wav',
          'https://amitaro.net/download/voice/401_ainote/nice_01.wav':'audio/voices/gal01/nice_01.wav',
          'https://amitaro.net/download/voice/401_ainote/nice_02.wav':'audio/voices/gal01/nice_02.wav',
          'https://amitaro.net/download/voice/103_yorokobu/yatta_01.wav':'audio/voices/gal01/yatta_01.wav',
          'https://amitaro.net/download/voice/103_yorokobu/yarii_01.wav':'audio/voices/gal01/yarii_01.wav',
          'https://amitaro.net/download/voice/111_ganbaru/sugoi_01.wav':'audio/voices/gal01/sugoi_01.wav',
          'https://amitaro.net/download/voice/111_ganbaru/sassugaa_02.wav':'audio/voices/gal01/sassugaa_02.wav'}
          for a,b in repl.items(): s=s.replace(a,b)
          assert 'GAL_IMGS' not in s
          assert 'amitaro.net/download/voice/' not in s
          # fixed rules guard
          compact=''.join(s.split())
          assert '[[[1,-36],[2,36]],[[3,-72],[10,0],[4,72]],[[5,-108],[11,-36],[12,36],[6,108]],[[7,-72],[9,0],[8,72]]]' in compact
          if s!=old: p.write_text(s)
      - name: Syntax check and commit
        shell: bash
        run: |
          set -euo pipefail
          node --check molkky/game.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add molkky/game.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Remove legacy asset references from fixed game core'
          git push
