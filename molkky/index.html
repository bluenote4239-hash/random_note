<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MÖLKKY GAL ARCADE</title>
<link rel="stylesheet" href="style.css?v=18">
<link rel="stylesheet" href="ipad.css?v=18">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="galFull" aria-hidden="true"></div>
  <div id="scan"></div>
  <div id="scoreBox" class="card"><div class="lab">SCORE</div><div id="score">0</div><div id="turn">TURN 1</div></div>
  <div id="goalBox" class="card"><div class="lab">TARGET</div><b>50 JUST</b><div id="miss">MISS × 0</div></div>
  <div id="galCoach"><div id="galBubble">ナイスー！</div><div id="galIcon" role="img" aria-label="実況ギャル"></div></div>
  <div id="galTag">GAL実況・うるさめ</div>
  <div id="centerMsg"></div>
  <div id="meters" class="card"><div class="row"><span>POWER</span><div class="bar"><div id="pf" class="fill"></div></div><span id="pv">0</span></div><div class="row"><span>ACCURACY</span><div class="bar"><div id="af" class="fill acc"></div></div><span id="av">0</span></div></div>
  <div id="cutin"><div id="cutinSpeed"></div><div id="cutinPanel"></div><div id="cutinImg" role="img" aria-label="ギャルカットイン"></div><div id="cutinText"></div></div>
  <div id="statusTip">指で照準移動 / タップ：POWER → ACCURACY → THROW</div><div id="log">READY</div>
  <div id="gameover"><div class="box"><h1 id="goTitle">PERFECT 50!</h1><p id="goText"></p><button onclick="resetGame()">もう一戦</button></div></div>
</div>
<script src="bootstrap.js?v=18"></script>
<script src="core/character-manager.js?v=18"></script>
<script src="characters/gal01/pack.js?v=18"></script>
<script src="core/stage-manager.js?v=18"></script>
<script src="stages/seaside90s/pack.js?v=18"></script>
<script src="core/audio-manager.js?v=18"></script>
<script src="audio/voices/gal01/pack.js?v=18"></script>
<script src="audio/se/default/pack.js?v=18"></script>
<script src="core/legacy-game-bridge.js?v=18"></script>
<script src="game.js?v=18"></script>
<script src="core/presentation-runtime.js?v=18"></script>
<script src="core/stage-runtime.js?v=18"></script>
<script src="audio/bgm/ievan_v29/engine.js?v=18"></script>
<script src="audio/bgm/ievan_v29/pack.js?v=18"></script>
<script src="core/audio-runtime.js?v=18"></script>
<script src="ipad.js?v=18"></script>
<script src="core/selftest.js?v=18"></script>
</body>
</html>
