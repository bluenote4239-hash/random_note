<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<base href="../../">
<title>MÖLKKY GAL ARCADE — LOCAL MATCH</title>
<link rel="stylesheet" href="style.css?v=27">
<link rel="stylesheet" href="ipad.css?v=27">
<link rel="stylesheet" href="experiments/manga_overdrive/shell.css?v=52">
<link rel="stylesheet" href="effects/manga_overdrive/style.css?v=52">
<link rel="stylesheet" href="experiments/local_versus/match.css?v=60">
</head>
<body>
<div id="game">
  <canvas id="c"></canvas>
  <div id="galFull" aria-hidden="true"></div>
  <div id="scan"></div>
  <div id="scoreBox" class="card"><div class="lab" data-content-text="ui.scoreLabel"></div><div id="score">0</div><div id="turn"></div></div>
  <div id="goalBox" class="card"><div class="lab" data-content-text="ui.targetLabel"></div><b data-content-text="ui.targetValue"></b><div id="miss"></div></div>

  <section id="versusHud" aria-label="対戦スコア">
    <article class="versus-player p1" id="playerCard0">
      <div class="versus-side" data-content-text="setup.oneSide"></div><strong id="playerName0"></strong>
      <div class="versus-score"><span id="playerScore0">0</span><small>/ 50</small></div>
      <div class="versus-miss" id="playerMiss0">MISS × 0</div>
    </article>
    <div id="versusCenter"><b id="matchModeLabel"></b><span id="roundLabel"></span></div>
    <article class="versus-player p2" id="playerCard1">
      <div class="versus-side" id="playerSide1"></div><strong id="playerName1"></strong>
      <div class="versus-score"><span id="playerScore1">0</span><small>/ 50</small></div>
      <div class="versus-miss" id="playerMiss1">MISS × 0</div>
    </article>
  </section>
  <div id="turnCall" role="status" aria-live="polite"><small data-content-text="match.nextThrow"></small><b></b><span></span></div>

  <div id="galCoach"><div id="galBubble" data-content-text="ui.initialBubble"></div><div id="galIcon" role="img" aria-label="実況ギャル"></div></div>
  <div id="galTag" data-content-text="ui.coachTag"></div>
  <div id="centerMsg"></div>
  <div id="meters" class="card"><div class="row"><span data-content-text="ui.power"></span><div class="bar"><div id="pf" class="fill"></div></div><span id="pv">0</span></div><div class="row"><span data-content-text="ui.accuracy"></span><div class="bar"><div id="af" class="fill acc"></div></div><span id="av">0</span></div></div>
  <div id="cutin"><div id="cutinSpeed"></div><div id="cutinPanel"></div><div id="cutinImg" role="img" aria-label="ギャルカットイン"></div><div id="cutinText"></div></div>
  <div id="statusTip" data-content-text="ui.statusTip"></div><div id="log" data-content-text="ui.ready"></div>
  <div id="fxBadge" data-content-text="page.badge"></div>

  <div id="matchSetup" class="show">
    <form id="matchSetupForm" class="match-panel">
      <p class="match-kicker" data-content-text="setup.kicker"></p>
      <h1 data-content-text="setup.title"></h1>
      <p class="match-rule" data-content-text="setup.rule"></p>
      <fieldset class="opponent-choice" aria-label="対戦相手">
        <label><input type="radio" name="opponentMode" value="cpu" checked><span data-content-text="setup.cpuChoice"></span></label>
        <label><input type="radio" name="opponentMode" value="human"><span data-content-text="setup.humanChoice"></span></label>
      </fieldset>
      <label class="name-row"><span data-content-text="setup.oneSide"></span><input id="playerInput0" maxlength="12" autocomplete="off"></label>
      <div class="match-vs" data-content-text="setup.versus"></div>
      <label class="name-row"><span id="setupSide1"></span><input id="playerInput1" maxlength="12" autocomplete="off" disabled></label>
      <button type="submit" data-content-text="setup.start"></button>
    </form>
  </div>

  <div id="gameover"><div class="box"><h1 id="goTitle"></h1><p id="goText"></p><button onclick="resetGame()" data-content-text="setup.replay"></button><button id="changePlayers" type="button" data-content-text="setup.change"></button></div></div>
</div>
<script src="bootstrap.js?v=27"></script>
<script src="core/content-manager.js?v=60"></script>
<script src="content/prototype_v59/pack.js?v=60"></script>
<script src="core/character-manager.js?v=27"></script>
<script src="core/stage-manager.js?v=27"></script>
<script src="core/audio-manager.js?v=58"></script>
<script src="experiments/local_versus/content-runtime.js?v=60"></script>
<script src="core/presentation-runtime.js?v=27"></script>
<script src="core/stage-runtime.js?v=27"></script>
<script src="core/audio-runtime.js?v=59"></script>
<script src="experiments/local_versus/file-bgm-player.js?v=60"></script>
<script src="audio/se/manga_overdrive/synth.js?v=52"></script>
<script src="experiments/local_versus/game-runtime.js?v=60"></script>
<script src="experiments/manga_overdrive/prototype-runtime.js?v=52"></script>
<script src="experiments/local_versus/cpu-easy.js?v=60"></script>
<script src="experiments/local_versus/match-runtime.js?v=60"></script>
<script src="effects/manga_overdrive/engine.js?v=52"></script>
<script src="ipad.js?v=28"></script>
<script src="experiments/local_versus/game-selftest.js?v=60"></script>
<script src="experiments/local_versus/match-selftest.js?v=60"></script>
</body>
</html>
